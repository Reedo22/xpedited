<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Xodus</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel-2: #1c2128; --line: #272d36;
    --text: #e6edf3; --dim: #8b949e; --green: #107c10; --green-hi: #16a516;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.5 "Segoe UI", Inter, system-ui, sans-serif; overflow: hidden; }
  #shell { display: grid; grid-template-rows: 56px 1fr; height: 100%; }

  header { display: flex; align-items: center; gap: 16px; padding: 0 20px;
    background: var(--panel); border-bottom: 1px solid var(--line); }
  .mark { width: 26px; height: 26px; border-radius: 6px; background: var(--green);
    display: grid; place-items: center; font-weight: 700; color: #fff; }
  h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .2px; }
  #search { flex: 1; max-width: 420px; margin-left: auto; padding: 7px 12px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px;
    color: var(--text); font-size: 13px; }
  #search:focus { outline: none; border-color: var(--green); }
  .tabs { display: flex; gap: 4px; }
  .tab { padding: 6px 12px; border-radius: 6px; cursor: pointer; color: var(--dim); font-size: 13px; }
  .tab.on { background: var(--panel-2); color: var(--text); }

  main { overflow-y: auto; padding: 20px 24px 40px; }
  #count { color: var(--dim); font-size: 12px; margin: 0 0 14px; }
  #grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }

  .card { cursor: pointer; }
  .shot { position: relative; aspect-ratio: 3/4; border-radius: 8px; overflow: hidden;
    background: var(--panel-2); border: 1px solid var(--line); }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card:hover .shot { border-color: var(--green); }
  .pill { position: absolute; top: 7px; right: 7px; font-size: 10px; padding: 2px 7px;
    border-radius: 99px; background: rgba(0,0,0,.72); color: var(--text); }
  .pill.ready { background: var(--green); }
  .name { margin-top: 7px; font-size: 12px; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  #sheet { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; }
  #sheet.on { display: grid; place-items: center; }
  .dialog { width: min(680px, 90vw); background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; overflow: hidden; }
  .hero { height: 200px; background: var(--panel-2) center/cover no-repeat; }
  .body { padding: 18px 22px 22px; }
  .body h2 { margin: 0 0 4px; font-size: 19px; }
  .pub { color: var(--dim); font-size: 12px; margin-bottom: 12px; }
  .desc { color: var(--dim); font-size: 13px; max-height: 96px; overflow-y: auto; margin-bottom: 18px; }
  .row { display: flex; gap: 10px; align-items: center; }
  button { font: inherit; border: 0; border-radius: 6px; padding: 9px 20px; cursor: pointer; }
  .go { background: var(--green); color: #fff; font-weight: 600; }
  .go:hover { background: var(--green-hi); }
  .go[disabled] { background: #2a2f37; color: var(--dim); cursor: default; }
  .ghost { background: var(--panel-2); color: var(--text); }
  .bar { flex: 1; height: 6px; border-radius: 99px; background: var(--panel-2); overflow: hidden; display: none; }
  .bar.on { display: block; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--green); transition: width .3s; }
  .note { color: var(--dim); font-size: 12px; margin-left: auto; }
</style>
</head>
<body>
<div id="shell">
  <header>
    <div class="mark">X</div>
    <h1>Xodus</h1>
    <div class="tabs">
      <div class="tab on" data-filter="all">All</div>
      <div class="tab" data-filter="ready">Installed</div>
    </div>
    <input id="search" placeholder="Search games">
  </header>
  <main>
    <p id="count">Loading the catalogue…</p>
    <div id="grid"></div>
  </main>
</div>

<div id="sheet"><div class="dialog">
  <div class="hero" id="d-hero"></div>
  <div class="body">
    <h2 id="d-title"></h2>
    <div class="pub" id="d-pub"></div>
    <div class="desc" id="d-desc"></div>
    <div class="row">
      <button class="go" id="d-go"></button>
      <button class="ghost" onclick="closeSheet()">Close</button>
      <div class="bar" id="d-bar"><i id="d-fill"></i></div>
      <span class="note" id="d-note"></span>
    </div>
  </div>
</div></div>

<script>
let GAMES = [], filter = "all", query = "", current = null;

function send(msg) { window.ipc.postMessage(JSON.stringify(msg)); }

function shown() {
  const q = query.trim().toLowerCase();
  return GAMES.filter(g =>
    (filter === "all" || g.installed) &&
    (!q || g.title.toLowerCase().includes(q)));
}

function draw() {
  const list = shown();
  document.getElementById("count").textContent =
    `${list.length} of ${GAMES.length} games · ${GAMES.filter(g => g.installed).length} installed`;
  document.getElementById("grid").innerHTML = list.map((g, i) => `
    <div class="card" onclick="openSheet('${g.id}')">
      <div class="shot">
        ${g.cover ? `<img loading="lazy" src="${g.cover}" alt="">` : ""}
        <span class="pill ${g.installed ? "ready" : ""}">${g.installed ? "Installed" : "Cloud"}</span>
      </div>
      <div class="name">${g.title.replace(/</g, "&lt;")}</div>
    </div>`).join("");
}

function openSheet(id) {
  const g = GAMES.find(x => x.id === id);
  if (!g) return;
  current = g;
  document.getElementById("d-hero").style.backgroundImage = g.hero ? `url(${g.hero})` : "none";
  document.getElementById("d-title").textContent = g.title;
  document.getElementById("d-pub").textContent = g.publisher || "";
  document.getElementById("d-desc").textContent = g.description || "";
  document.getElementById("d-note").textContent = g.size ? (g.size / 1e9).toFixed(1) + " GB" : "";
  setAction(g);
  document.getElementById("d-bar").classList.remove("on");
  document.getElementById("sheet").classList.add("on");
}
function setAction(g) {
  const b = document.getElementById("d-go");
  b.disabled = false;
  b.textContent = g.installed ? "Play" : "Install";
  b.onclick = () => { send({ kind: g.installed ? "play" : "install", id: g.id }); b.disabled = true;
                      b.textContent = g.installed ? "Starting…" : "Installing…";
                      if (!g.installed) document.getElementById("d-bar").classList.add("on"); };
}
function closeSheet() { document.getElementById("sheet").classList.remove("on"); current = null; }

// called from Rust
function xodusCatalogue(json) { GAMES = json; draw(); }
function xodusProgress(id, pct, note) {
  if (current && current.id === id) {
    document.getElementById("d-fill").style.width = pct + "%";
    if (note) document.getElementById("d-note").textContent = note;
  }
}
function xodusInstalled(id) {
  const g = GAMES.find(x => x.id === id);
  if (g) { g.installed = true; draw(); if (current && current.id === id) setAction(g); }
}

document.getElementById("search").addEventListener("input", e => { query = e.target.value; draw(); });
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("on"));
  t.classList.add("on"); filter = t.dataset.filter; draw();
}));
document.getElementById("sheet").addEventListener("click", e => {
  if (e.target.id === "sheet") closeSheet();
});
send({ kind: "ready" });
</script>
</body>
</html>
