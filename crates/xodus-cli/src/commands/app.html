<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Xodus</title>
<style>
  :root {
    --bg:#0d1117; --side:#12161d; --panel:#161b22; --line:#242b35;
    --text:#e6edf3; --dim:#8b949e; --green:#107c10; --green-hi:#16a516;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font:14px/1.5 "Segoe UI",Inter,system-ui,sans-serif; overflow:hidden; }
  #shell { display:grid; grid-template-columns:300px 1fr; height:100%; }

  /* ---- left: the library list, Steam style ---- */
  aside { background:var(--side); border-right:1px solid var(--line); display:flex; flex-direction:column; }
  .brand { display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line); }
  .mark { width:24px; height:24px; border-radius:5px; background:var(--green);
    display:grid; place-items:center; font-weight:700; font-size:13px; color:#fff; }
  .brand b { font-size:14px; font-weight:600; }
  .find { padding:10px 12px; }
  .find input { width:100%; padding:7px 10px; background:#0b0e13; border:1px solid var(--line);
    border-radius:6px; color:var(--text); font-size:13px; }
  .find input:focus { outline:none; border-color:var(--green); }
  .filters { display:flex; gap:4px; padding:0 12px 10px; }
  .chip { flex:1; text-align:center; padding:5px; border-radius:5px; cursor:pointer;
    font-size:12px; color:var(--dim); background:#0b0e13; }
  .chip.on { background:var(--green); color:#fff; }
  #list { flex:1; overflow-y:auto; padding:0 6px 14px; }
  .sect { padding:12px 10px 6px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); }
  .row { display:flex; align-items:center; gap:9px; padding:6px 10px; border-radius:6px; cursor:pointer; }
  .row:hover { background:#1a1f27; }
  .row.on { background:#1f2630; }
  .row img { width:22px; height:30px; object-fit:cover; border-radius:3px; background:#0b0e13; flex:none; }
  .row span { font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row.off span { color:var(--dim); }

  /* ---- right: the selected game ---- */
  main { position:relative; overflow-y:auto; }
  #empty { display:grid; place-items:center; height:100%; color:var(--dim); }
  #hero { height:46%; min-height:280px; background:#0b0e13 center/cover no-repeat; position:relative; }
  #hero:after { content:""; position:absolute; inset:0;
    background:linear-gradient(to bottom, transparent 35%, var(--bg) 100%); }
  #head { position:relative; margin-top:-70px; padding:0 34px; z-index:1; }
  #logo { max-height:70px; max-width:46%; display:none; }
  #title { font-size:27px; font-weight:600; margin:0; }
  #pub { color:var(--dim); font-size:13px; margin-top:2px; }
  #acts { display:flex; align-items:center; gap:12px; margin:20px 0 0; }
  button { font:inherit; border:0; border-radius:6px; padding:11px 30px; cursor:pointer; }
  .go { background:var(--green); color:#fff; font-weight:600; font-size:15px; }
  .go:hover { background:var(--green-hi); }
  .go[disabled] { background:#262c35; color:var(--dim); cursor:default; }
  .meta { color:var(--dim); font-size:12px; }
  .bar { width:230px; height:6px; border-radius:99px; background:#262c35; overflow:hidden; display:none; }
  .bar.on { display:block; }
  .bar > i { display:block; height:100%; width:0; background:var(--green); transition:width .4s; }
  #desc { padding:22px 34px 40px; color:var(--dim); font-size:13.5px; max-width:760px; }
  .tagline { display:inline-block; font-size:11px; padding:2px 8px; border-radius:99px;
    background:#1f2630; color:var(--dim); margin-left:8px; vertical-align:middle; }
</style>
</head>
<body>
<div id="shell">
  <aside>
    <div class="brand"><div class="mark">X</div><b>Xodus</b></div>
    <div class="find"><input id="q" placeholder="Search"></div>
    <div class="filters">
      <div class="chip on" data-f="all">All</div>
      <div class="chip" data-f="ready">Installed</div>
      <div class="chip" data-f="owned">Owned</div>
    </div>
    <div id="list"></div>
  </aside>
  <main>
    <div id="empty">Pick a game on the left</div>
    <div id="view" style="display:none">
      <div id="hero"></div>
      <div id="head">
        <img id="logo">
        <h1 id="title"></h1>
        <div id="pub"></div>
        <div id="acts">
          <button class="go" id="go"></button>
          <div class="bar" id="bar"><i id="fill"></i></div>
          <span class="meta" id="meta"></span>
        </div>
      </div>
      <div id="desc"></div>
    </div>
  </main>
</div>

<script>
let GAMES = [], filter = "all", query = "", picked = null;
const $ = id => document.getElementById(id);
const send = m => window.ipc.postMessage(JSON.stringify(m));
const esc = t => (t || "").replace(/[<>&]/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]));

function visible() {
  const q = query.trim().toLowerCase();
  return GAMES.filter(g =>
    (filter === "all" || (filter === "ready" && g.installed) || (filter === "owned" && g.source === "owned")) &&
    (!q || g.title.toLowerCase().includes(q)));
}

function drawList() {
  const all = visible();
  const ready = all.filter(g => g.installed);
  const rest = all.filter(g => !g.installed);
  const row = g => `<div class="row ${g.installed ? "" : "off"} ${picked === g.id ? "on" : ""}" onclick="pick('${g.id}')">
      ${g.cover ? `<img loading="lazy" src="${g.cover}">` : `<img>`}<span>${esc(g.title)}</span></div>`;
  $("list").innerHTML =
    (ready.length ? `<div class="sect">Installed — ${ready.length}</div>` + ready.map(row).join("") : "") +
    (rest.length ? `<div class="sect">Library — ${rest.length}</div>` + rest.map(row).join("") : "");
}

function pick(id) {
  const g = GAMES.find(x => x.id === id);
  if (!g) return;
  picked = id;
  $("empty").style.display = "none";
  $("view").style.display = "block";
  $("hero").style.backgroundImage = g.hero ? `url(${g.hero})` : "none";
  const logo = $("logo");
  if (g.logo) { logo.src = g.logo; logo.style.display = "block"; } else { logo.style.display = "none"; }
  $("title").innerHTML = esc(g.title) + (g.source === "owned" ? `<span class="tagline">Owned</span>` : `<span class="tagline">Game Pass</span>`);
  $("pub").textContent = g.publisher || "";
  $("desc").textContent = g.description || "";
  $("meta").textContent = g.size ? (g.size / 1e9).toFixed(1) + " GB" : "";
  $("bar").classList.remove("on");
  action(g);
  drawList();
}

function action(g) {
  const b = $("go");
  b.disabled = false;
  b.textContent = g.installed ? "Play" : "Install";
  b.onclick = () => {
    send({ kind: g.installed ? "play" : "install", id: g.id });
    b.disabled = true;
    b.textContent = g.installed ? "Starting…" : "Installing…";
    if (!g.installed) $("bar").classList.add("on");
  };
}

// from Rust
function xodusCatalogue(json) { GAMES = json; drawList(); if (picked) pick(picked); }
function xodusProgress(id, pct, note) {
  if (picked === id) { $("fill").style.width = pct + "%"; if (note) $("meta").textContent = note; }
}
function xodusInstalled(id) {
  const g = GAMES.find(x => x.id === id);
  if (!g) return;
  g.installed = true;
  drawList();
  if (picked === id) { $("bar").classList.remove("on"); action(g); }
}

$("q").addEventListener("input", e => { query = e.target.value; drawList(); });
document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
  document.querySelectorAll(".chip").forEach(x => x.classList.remove("on"));
  c.classList.add("on"); filter = c.dataset.f; drawList();
}));
send({ kind: "ready" });
</script>
</body>
</html>
